<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vector Angle Motion</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace has-vector-display" aria-label="ベクトルのなす角アニメーション">
        <header class="topbar">
          <div>
            <p class="eyebrow">Vector Method</p>
            <div class="title-row">
              <h1>ベクトルのなす角</h1>
              <span class="debug-badge">デバッグ中</span>
            </div>
          </div>
          <div class="status-strip" aria-live="polite">
            <a class="home-link" href="./index.html">一覧へ</a>
            <span id="dimensionStatus">2 次元</span>
            <span>θ</span>
          </div>
        </header>

        <section class="control-band method-controls" aria-label="設定">
          <div class="control-group">
            <label for="dimension">次元</label>
            <select id="dimension">
              <option value="2">2 次元</option>
              <option value="3">3 次元</option>
            </select>
          </div>
          <div class="control-group">
            <label>入力</label>
            <div class="button-row">
              <button id="randomize" type="button" class="secondary">ランダム</button>
              <button id="animate" type="button" class="primary">再生</button>
            </div>
          </div>
        </section>

        <section id="message" class="message" role="status"></section>

        <section class="vector-stage angle-stage" aria-label="ベクトルと角度">
          <article class="matrix-panel vector-panel">
            <header>
              <h2>a</h2>
              <span id="labelA">2 要素</span>
            </header>
            <div id="vectorA" class="vector-input" aria-label="ベクトルa"></div>
          </article>

          <article class="matrix-panel vector-panel">
            <header>
              <h2>b</h2>
              <span id="labelB">2 要素</span>
            </header>
            <div id="vectorB" class="vector-input" aria-label="ベクトルb"></div>
          </article>

          <article class="matrix-panel result-panel angle-result-panel">
            <header>
              <h2>θ</h2>
              <span>なす角</span>
            </header>
            <div id="resultValue" class="scalar-result" aria-label="角度の結果">?</div>
            <div id="resultDetail" class="result-detail">cos θ = (a · b) / (|a||b|) を使います。</div>
          </article>
        </section>

        <section class="vector-display-band" aria-label="数式表示">
          <div class="inverse-display-header">
            <h2>数式表示</h2>
            <span>内積とベクトルの長さから角度を求めます</span>
          </div>
          <div id="equationDisplay" class="vector-equation" aria-label="角度の数式"></div>
        </section>

        <section class="animation-band" aria-label="計算状況表示">
          <div class="timeline">
            <div id="animationTrack" class="animation-track"></div>
          </div>
          <div class="formula-box">
            <div id="formulaTitle" class="formula-title">なす角</div>
            <div id="formula" class="formula">まず内積を求め、その後 |a| と |b| で割って cos θ を作り、最後に arccos をとります。</div>
            <div class="history-title">計算履歴</div>
            <ol id="historyList" class="history-list" aria-label="計算履歴"></ol>
          </div>
        </section>
      </section>
    </main>

    <script src="./vector_methods.js"></script>
  </body>
</html>
