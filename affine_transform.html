<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rotation Scale Translation Motion</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css?v=20260508a" />
    <style>
      body[data-topic="affine-transform"] .sub-control-band {
        grid-row: 3;
      }

      body[data-topic="affine-transform"] .workspace.has-sub-control-band .message {
        grid-row: 4;
      }

      body[data-topic="affine-transform"] .workspace.has-sub-control-band .vector-display-band {
        grid-row: 5;
      }

      body[data-topic="affine-transform"] .workspace.has-sub-control-band .vector-diagram-band {
        grid-row: 6;
      }

      body[data-topic="affine-transform"] .workspace.has-sub-control-band .animation-band {
        grid-row: 7;
      }

      body[data-topic="affine-transform"] .diagram-label-group,
      body[data-topic="affine-transform"] .diagram-axis-label,
      body[data-topic="affine-transform"] .diagram-axis-name {
        display: none;
      }
    </style>
  </head>
  <body data-topic="affine-transform">
    <main class="app-shell">
      <section class="workspace has-vector-display has-vector-diagram has-sub-control-band" aria-label="回転と拡大縮小と平行移動">
        <header class="topbar">
          <div>
            <p class="eyebrow">Transformation</p>
            <div class="title-row">
              <h1>回転・拡大縮小・平行移動</h1>
              <span class="debug-badge">デバッグ中</span>
            </div>
          </div>
          <div class="status-strip">
            <a class="home-link" href="./future_index.html">一覧へ</a>
            <span id="dimensionStatus">2 次元</span>
            <span id="transformStatus">回転</span>
          </div>
        </header>

        <section class="control-band">
          <div class="control-group">
            <label for="dimension">次元</label>
            <select id="dimension">
              <option value="2">2 次元</option>
              <option value="3">3 次元</option>
            </select>
          </div>
          <div class="control-group">
            <label for="transformType">変換</label>
            <select id="transformType">
              <option value="rotate">回転</option>
              <option value="scale">拡大縮小</option>
              <option value="translate">平行移動</option>
            </select>
          </div>
          <div class="control-group">
            <label>入力</label>
            <div class="button-row">
              <button id="randomize" type="button" class="secondary">ランダム</button>
              <button id="animate" type="button" class="primary">再生</button>
            </div>
          </div>
        </section>

        <section id="subControls" class="control-band sub-control-band topic-sub-controls">
          <div id="axisControl" class="control-group">
            <label for="axis">3D 回転軸</label>
            <select id="axis">
              <option value="x">x 軸</option>
              <option value="y">y 軸</option>
              <option value="z">z 軸</option>
            </select>
          </div>
          <div class="control-group">
            <label>変換パラメータ</label>
            <div id="params" class="topic-inline-grid"></div>
          </div>
          <div class="control-group">
            <label>対象点 p</label>
            <div id="pointInput" class="vector-input"></div>
          </div>
        </section>

        <section id="message" class="message" role="status"></section>

        <section class="vector-display-band">
          <div class="inverse-display-header">
            <h2>数式表示</h2>
            <span>平行移動だけは通常座標では写像として扱います</span>
          </div>
          <div id="equationDisplay" class="vector-equation"></div>
          <div id="resultSummary" class="topic-summary-box">変換後の点を表示します。</div>
        </section>

        <section class="vector-diagram-band">
          <div class="vector-diagram-header">
            <div class="inverse-display-header">
              <h2>図解表示</h2>
              <span>元の図形と変換後の図形を重ねて見ます</span>
            </div>
            <div id="viewControls" class="control-group view-controls" hidden>
              <label>回転</label>
              <div class="view-slider-row"><span>X軸</span><input id="rotateX" type="range" min="-180" max="180" value="0" /><output id="rotateXValue">0°</output></div>
              <div class="view-slider-row"><span>Y軸</span><input id="rotateY" type="range" min="-180" max="180" value="0" /><output id="rotateYValue">0°</output></div>
              <div class="view-slider-row"><span>Z軸</span><input id="rotateZ" type="range" min="-180" max="180" value="0" /><output id="rotateZValue">0°</output></div>
            </div>
          </div>
          <svg id="vectorDiagram" class="vector-diagram" viewBox="0 0 720 360"></svg>
        </section>

        <section class="animation-band">
          <div class="timeline"><div id="animationTrack" class="animation-track"></div></div>
          <div class="formula-box">
            <div id="formulaTitle" class="formula-title">変換</div>
            <div id="formula" class="formula">回転と拡大縮小は線形写像、平行移動はアフィン写像です。</div>
            <div class="history-title">計算履歴</div>
            <ol id="historyList" class="history-list"></ol>
          </div>
        </section>
      </section>
    </main>
    <script src="./future_topics.js?v=20260508a"></script>
  </body>
</html>
