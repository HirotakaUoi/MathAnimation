<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Linear Independence Motion</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-topic="linear-independence">
    <main class="app-shell">
      <section class="workspace has-vector-display has-vector-diagram" aria-label="線形独立と線形従属">
        <header class="topbar">
          <div>
            <p class="eyebrow">Linear Algebra</p>
            <div class="title-row">
              <h1>線形独立と線形従属</h1>
              <span class="debug-badge">デバッグ中</span>
            </div>
          </div>
          <div class="status-strip">
            <a class="home-link" href="./future_index.html">一覧へ</a>
            <span id="dimensionStatus">2 次元</span>
            <span id="modeStatus">線形独立</span>
          </div>
        </header>

        <section class="control-band" aria-label="設定">
          <div class="control-group">
            <label for="dimension">次元</label>
            <select id="dimension">
              <option value="2">2 次元</option>
              <option value="3">3 次元</option>
            </select>
          </div>
          <div class="control-group">
            <label for="mode">例</label>
            <select id="mode">
              <option value="independent">線形独立</option>
              <option value="dependent">線形従属</option>
            </select>
          </div>
          <div class="control-group">
            <label>入力</label>
            <div class="button-row">
              <button id="randomize" type="button" class="secondary">ランダム</button>
              <button id="animate" type="button" class="primary">再生</button>
            </div>
          </div>
        </section>

        <section id="message" class="message" role="status"></section>

        <section class="topic-stage topic-stage-4" aria-label="入力ベクトル">
          <article class="matrix-panel vector-panel">
            <header><h2>v1</h2><span>入力</span></header>
            <div id="vector1" class="vector-input"></div>
          </article>
          <article class="matrix-panel vector-panel">
            <header><h2>v2</h2><span>入力</span></header>
            <div id="vector2" class="vector-input"></div>
          </article>
          <article id="panel3" class="matrix-panel vector-panel">
            <header><h2>v3</h2><span>入力</span></header>
            <div id="vector3" class="vector-input"></div>
          </article>
          <article class="matrix-panel result-panel">
            <header><h2>判定</h2><span>要約</span></header>
            <div id="summary" class="topic-summary-box">一次結合の様子を確認します。</div>
          </article>
        </section>

        <section class="vector-display-band" aria-label="数式表示">
          <div class="inverse-display-header">
            <h2>数式表示</h2>
            <span>行列式と一次結合の視点で判定します</span>
          </div>
          <div id="equationDisplay" class="vector-equation"></div>
        </section>

        <section class="vector-diagram-band" aria-label="図解表示">
          <div class="vector-diagram-header">
            <div class="inverse-display-header">
              <h2>図解表示</h2>
              <span>同じ平面や空間を張れているかを見ます</span>
            </div>
            <div id="viewControls" class="control-group view-controls" hidden>
              <label>回転</label>
              <div class="view-slider-row"><span>X軸</span><input id="rotateX" type="range" min="-180" max="180" value="0" /><output id="rotateXValue">0°</output></div>
              <div class="view-slider-row"><span>Y軸</span><input id="rotateY" type="range" min="-180" max="180" value="0" /><output id="rotateYValue">0°</output></div>
              <div class="view-slider-row"><span>Z軸</span><input id="rotateZ" type="range" min="-180" max="180" value="0" /><output id="rotateZValue">0°</output></div>
            </div>
          </div>
          <svg id="vectorDiagram" class="vector-diagram" viewBox="0 0 720 360"></svg>
        </section>

        <section class="animation-band" aria-label="計算状況表示">
          <div class="timeline"><div id="animationTrack" class="animation-track"></div></div>
          <div class="formula-box">
            <div id="formulaTitle" class="formula-title">線形独立</div>
            <div id="formula" class="formula">c1v1 + c2v2 (+ c3v3) = 0 の解を見ます。</div>
            <div class="history-title">計算履歴</div>
            <ol id="historyList" class="history-list"></ol>
          </div>
        </section>
      </section>
    </main>
    <script src="./future_topics.js"></script>
  </body>
</html>
