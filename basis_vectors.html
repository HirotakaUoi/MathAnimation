<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Basis Vector Motion</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <style>
      body[data-topic="basis-vectors"] .diagram-label-group {
        display: none;
      }

      body[data-topic="basis-vectors"] .diagram-line {
        stroke-linecap: butt;
      }
    </style>
  </head>
  <body data-topic="basis-vectors">
    <main class="app-shell">
      <section class="workspace has-vector-display has-vector-diagram" aria-label="基底ベクトルと標準基底">
        <header class="topbar">
          <div>
            <p class="eyebrow">Linear Algebra</p>
            <div class="title-row">
              <h1>基底ベクトルと標準基底</h1>
              <span class="debug-badge">デバッグ中</span>
            </div>
          </div>
          <div class="status-strip">
            <a class="home-link" href="./future_index.html">一覧へ</a>
            <span id="dimensionStatus">2 次元</span>
            <span id="basisStatus">標準基底と基底</span>
          </div>
        </header>

        <section class="control-band" aria-label="設定">
          <div class="control-group">
            <label for="dimension">次元</label>
            <select id="dimension">
              <option value="2">2 次元</option>
              <option value="3">3 次元</option>
            </select>
          </div>
          <div class="control-group">
            <label>説明</label>
            <div class="topic-inline-copy">標準基底での見方と、別の基底での見方を並べて比較します。</div>
          </div>
          <div class="control-group">
            <label>入力</label>
            <div class="button-row">
              <button id="randomize" type="button" class="secondary">ランダム</button>
              <button id="animate" type="button" class="primary">再生</button>
            </div>
          </div>
        </section>

        <section id="message" class="message" role="status"></section>

        <section class="topic-stage topic-stage-4" aria-label="基底と対象ベクトル">
          <article class="matrix-panel vector-panel">
            <header><h2>u1</h2><span>基底ベクトル</span></header>
            <div id="basis1" class="vector-input"></div>
          </article>
          <article class="matrix-panel vector-panel">
            <header><h2>u2</h2><span>基底ベクトル</span></header>
            <div id="basis2" class="vector-input"></div>
          </article>
          <article id="basis3Panel" class="matrix-panel vector-panel">
            <header><h2>u3</h2><span>基底ベクトル</span></header>
            <div id="basis3" class="vector-input"></div>
          </article>
          <article class="matrix-panel result-panel">
            <header><h2>v</h2><span>対象ベクトル</span></header>
            <div id="targetVector" class="vector-input"></div>
            <div id="coordinateSummary" class="result-detail">この基底での座標を計算します。</div>
          </article>
        </section>

        <section class="vector-display-band">
          <div class="inverse-display-header">
            <h2>数式表示</h2>
            <span>標準基底と任意の基底の違いを比べます</span>
          </div>
          <div id="equationDisplay" class="vector-equation"></div>
        </section>

        <section class="vector-diagram-band">
          <div class="vector-diagram-header">
            <div class="inverse-display-header">
              <h2>図解表示</h2>
              <span>標準基底 e と入力した基底 u を同時に見ます</span>
            </div>
            <div id="viewControls" class="control-group view-controls" hidden>
              <label>回転</label>
              <div class="view-slider-row"><span>X軸</span><input id="rotateX" type="range" min="-180" max="180" value="0" /><output id="rotateXValue">0°</output></div>
              <div class="view-slider-row"><span>Y軸</span><input id="rotateY" type="range" min="-180" max="180" value="0" /><output id="rotateYValue">0°</output></div>
              <div class="view-slider-row"><span>Z軸</span><input id="rotateZ" type="range" min="-180" max="180" value="0" /><output id="rotateZValue">0°</output></div>
            </div>
          </div>
          <svg id="vectorDiagram" class="vector-diagram" viewBox="0 0 720 360"></svg>
        </section>

        <section class="animation-band">
          <div class="timeline"><div id="animationTrack" class="animation-track"></div></div>
          <div class="formula-box">
            <div id="formulaTitle" class="formula-title">基底</div>
            <div id="formula" class="formula">標準基底では各成分がそのまま座標です。</div>
            <div class="history-title">計算履歴</div>
            <ol id="historyList" class="history-list"></ol>
          </div>
        </section>
      </section>
    </main>
    <script src="./future_topics.js?v=20260508d"></script>
      <script src="./math_format.js?v=20260518a"></script>
  </body>
</html>
