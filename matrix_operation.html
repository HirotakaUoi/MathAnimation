<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Matrix Motion</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace" aria-label="行列演算アニメーション">
        <header class="topbar">
          <div>
            <p class="eyebrow">Matrix Motion</p>
            <h1>行列演算アニメーター</h1>
          </div>
          <div class="status-strip" aria-live="polite">
            <a class="home-link" href="./index.html">一覧へ</a>
            <span id="dimensionStatus">2 x 2</span>
            <span id="operationStatus">A + B</span>
          </div>
        </header>

        <section class="control-band" aria-label="設定">
          <div class="control-group">
            <label for="operation">演算</label>
            <select id="operation">
              <option value="add">加算 A + B</option>
              <option value="subtract">減算 A - B</option>
              <option value="multiply">乗算 A x B</option>
              <option value="divide">除算 A ÷ B</option>
            </select>
          </div>

          <div class="control-group">
            <label>サイズ</label>
            <div class="size-grid">
              <span>A</span>
              <input id="rowsA" type="number" min="1" max="4" value="2" aria-label="Aの行数" />
              <span>x</span>
              <input id="colsA" type="number" min="1" max="4" value="2" aria-label="Aの列数" />
              <span>B</span>
              <input id="rowsB" type="number" min="1" max="4" value="2" aria-label="Bの行数" />
              <span>x</span>
              <input id="colsB" type="number" min="1" max="4" value="2" aria-label="Bの列数" />
            </div>
          </div>

          <div class="control-group">
            <label>入力</label>
            <div class="button-row">
              <button id="randomize" type="button" class="secondary">ランダム</button>
              <button id="fitDimensions" type="button" class="secondary">演算に合わせる</button>
              <button id="animate" type="button" class="primary">再生</button>
            </div>
          </div>
        </section>

        <section id="message" class="message" role="status"></section>

        <section class="matrix-stage" aria-label="行列入力と結果">
          <article class="matrix-panel">
            <header>
              <h2>A</h2>
              <span id="labelA">2 x 2</span>
            </header>
            <div id="matrixA" class="matrix-input" aria-label="行列A"></div>
          </article>

          <div class="operator-glyph" id="operatorGlyph">+</div>

          <article class="matrix-panel">
            <header>
              <h2>B</h2>
              <span id="labelB">2 x 2</span>
            </header>
            <div id="matrixB" class="matrix-input" aria-label="行列B"></div>
          </article>

          <div class="operator-glyph equals">=</div>

          <article class="matrix-panel result-panel">
            <header>
              <h2>Result</h2>
              <span id="labelR">2 x 2</span>
            </header>
            <div id="matrixResult" class="matrix-output" aria-label="計算結果"></div>
          </article>
        </section>

        <section id="divisionDetail" class="division-detail" aria-label="除算の変形"></section>

        <section class="animation-band" aria-label="演算の流れ">
          <div class="timeline">
            <div id="animationTrack" class="animation-track"></div>
          </div>
          <div class="formula-box">
            <div id="formulaTitle" class="formula-title">各セルの計算</div>
            <div id="formula" class="formula">再生するとここに計算過程が表示されます。</div>
            <div class="history-title">計算履歴</div>
            <ol id="historyList" class="history-list" aria-label="計算履歴"></ol>
          </div>
        </section>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
