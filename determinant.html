<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Determinant Motion</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace has-determinant-display" aria-label="行列式アニメーション">
        <header class="topbar">
          <div>
            <p class="eyebrow">Determinant</p>
            <div class="title-row">
              <h1>行列式と求め方</h1>
            </div>
          </div>
          <div class="status-strip" aria-live="polite">
            <a class="home-link" href="./index.html">一覧へ</a>
            <span id="dimensionStatus">2 x 2</span>
            <span>det(A)</span>
          </div>
        </header>

        <section class="control-band method-controls" aria-label="設定">
          <div class="control-group">
            <label for="sizeN">サイズ</label>
            <select id="sizeN">
              <option value="2">2 x 2</option>
              <option value="3">3 x 3</option>
              <option value="4">4 x 4</option>
            </select>
          </div>
          <div class="control-group">
            <label for="methodMode">求め方</label>
            <select id="methodMode">
              <option value="elimination">上三角化</option>
              <option value="cofactor">余因子展開</option>
              <option value="cofactor-compact">余因子展開（簡潔）</option>
              <option value="sarrus">サラスの公式</option>
            </select>
          </div>
          <div class="control-group">
            <label>入力</label>
            <div class="button-row">
              <button id="randomize" type="button" class="secondary">ランダム</button>
              <button id="animate" type="button" class="primary">再生</button>
            </div>
          </div>
        </section>

        <section id="message" class="message" role="status"></section>

        <section class="determinant-display-band" aria-label="行列式の数式表示">
          <div class="inverse-display-header">
            <h2>数式表示</h2>
            <span>元の行列と行列式</span>
          </div>
          <div class="inverse-equation" aria-label="行列式の数式">
            <div class="math-matrix-term">
              <div class="math-matrix-label">A</div>
              <div id="mathMatrixA" class="math-matrix" aria-label="元行列A"></div>
            </div>
            <div class="math-equals">→</div>
            <div class="determinant-value-box">
              <div class="math-matrix-label">det(A)</div>
              <div id="determinantValue" class="determinant-value pending-solution">?</div>
            </div>
          </div>
        </section>

        <section class="matrix-stage determinant-stage" aria-label="行列式の入力と結果">
          <article class="matrix-panel">
            <header>
              <h2>A</h2>
              <span id="labelA">2 x 2</span>
            </header>
            <div id="matrixA" class="matrix-input" aria-label="行列A"></div>
          </article>

          <article class="matrix-panel method-wide">
            <header>
              <div class="panel-title-row">
                <h2 id="methodTitle">上三角化</h2>
              </div>
              <span id="methodSubtitle">行基本変形</span>
            </header>
            <div id="methodMatrix" class="matrix-output method-matrix" aria-label="上三角化の途中経過"></div>
          </article>

          <article class="matrix-panel result-panel">
            <header>
              <h2>Result</h2>
              <span id="labelR">det(A)</span>
            </header>
            <div id="resultMatrix" class="matrix-output solution-output" aria-label="行列式の値"></div>
          </article>
        </section>

        <section class="animation-band" aria-label="計算状況表示">
          <div class="timeline">
            <div id="animationTrack" class="animation-track"></div>
          </div>
          <div class="formula-box">
            <div id="formulaTitle" class="formula-title">行列式</div>
            <div id="formula" class="formula">行の入れ替えで符号を変え、下を 0 にして上三角行列の対角成分の積をとります。</div>
            <div class="history-title">計算履歴</div>
            <ol id="historyList" class="history-list" aria-label="計算履歴"></ol>
          </div>
        </section>
      </section>
    </main>

    <script src="./determinant.js"></script>
      <script src="./math_format.js?v=20260518a"></script>
  </body>
</html>
