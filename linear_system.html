<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Linear System Motion</title>
    <meta name="theme-color" content="#0f766e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace" aria-label="連立一次方程式アニメーション">
        <header class="topbar">
          <div>
            <p class="eyebrow">Matrix Method</p>
            <h1>掃き出し法で解く連立一次方程式</h1>
          </div>
          <div class="status-strip" aria-live="polite">
            <a class="home-link" href="./index.html">一覧へ</a>
            <span id="dimensionStatus">2 元</span>
            <span>Ax = b</span>
          </div>
        </header>

        <section class="control-band method-controls" aria-label="設定">
          <div class="control-group">
            <label for="sizeN">未知数の数</label>
            <select id="sizeN">
              <option value="2">2 元</option>
              <option value="3">3 元</option>
              <option value="4">4 元</option>
            </select>
          </div>
          <div class="control-group">
            <label>入力</label>
            <div class="button-row">
              <button id="randomize" type="button" class="secondary">ランダム</button>
              <button id="animate" type="button" class="primary">再生</button>
            </div>
          </div>
        </section>

        <section id="message" class="message" role="status"></section>

        <section class="equation-display-band" aria-label="連立一次方程式">
          <div class="equation-display-header">
            <h2>方程式</h2>
            <span>元の式と変形後を比較</span>
          </div>
          <div class="equation-compare">
            <div class="equation-group">
              <div class="equation-group-title">元の方程式</div>
              <div id="originalEquationSystem" class="equation-system" aria-label="元の方程式"></div>
            </div>
            <div class="equation-group">
              <div class="equation-group-title">変形中</div>
              <div id="equationSystem" class="equation-system" aria-label="変形中の方程式"></div>
            </div>
          </div>
        </section>

        <section class="matrix-stage method-stage" aria-label="連立一次方程式の入力と結果">
          <article class="matrix-panel">
            <header>
              <h2>[ A | b ]</h2>
              <span id="labelA">2 元</span>
            </header>
            <div id="matrixA" class="matrix-input" aria-label="拡大係数行列入力"></div>
          </article>

          <article class="matrix-panel method-wide">
            <header>
              <h2>掃き出し</h2>
              <span>行基本変形</span>
            </header>
            <div id="methodMatrix" class="matrix-output method-matrix" aria-label="掃き出し法の途中経過"></div>
          </article>
        </section>

        <section class="animation-band" aria-label="計算状況表示">
          <div class="timeline">
            <div id="animationTrack" class="animation-track"></div>
          </div>
          <div class="formula-box">
            <div id="formulaTitle" class="formula-title">掃き出し法</div>
            <div id="formula" class="formula">左側を単位行列に変形すると、右側に解が現れます。</div>
            <div class="history-title">計算履歴</div>
            <ol id="historyList" class="history-list" aria-label="計算履歴"></ol>
          </div>
        </section>
      </section>
    </main>

    <script src="./pwa.js"></script>
    <script src="./matrix_methods.js"></script>
  </body>
</html>
