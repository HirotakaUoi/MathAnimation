<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Homogeneous Coordinates Motion</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-topic="homogeneous-coordinates">
    <main class="app-shell">
      <section class="workspace has-vector-display has-vector-diagram" aria-label="同次座標系とグラフィックス">
        <header class="topbar">
          <div>
            <p class="eyebrow">Graphics Math</p>
            <div class="title-row">
              <h1>同次座標系とグラフィックス</h1>
              <span class="debug-badge">デバッグ中</span>
            </div>
          </div>
          <div class="status-strip">
            <a class="home-link" href="./future_index.html">一覧へ</a>
            <span id="dimensionStatus">2 次元</span>
            <span id="modeStatus">平行移動</span>
          </div>
        </header>

        <section class="control-band">
          <div class="control-group">
            <label for="dimension">次元</label>
            <select id="dimension">
              <option value="2">2 次元</option>
              <option value="3">3 次元</option>
            </select>
          </div>
          <div class="control-group">
            <label for="mode">変換例</label>
            <select id="mode">
              <option value="translate">平行移動</option>
              <option value="affine">回転＋平行移動</option>
            </select>
          </div>
          <div class="control-group">
            <label>入力</label>
            <div class="button-row">
              <button id="randomize" type="button" class="secondary">初期化</button>
              <button id="animate" type="button" class="primary">再生</button>
            </div>
          </div>
        </section>

        <section id="message" class="message" role="status"></section>

        <section class="topic-stage topic-stage-3">
          <article class="matrix-panel vector-panel">
            <header><h2>p</h2><span>点</span></header>
            <div id="pointInput" class="vector-input"></div>
          </article>
          <article class="matrix-panel">
            <header><h2>H</h2><span>同次変換行列</span></header>
            <div id="matrixInput" class="matrix-input"></div>
          </article>
          <article class="matrix-panel result-panel">
            <header><h2>結果</h2><span>同次座標</span></header>
            <div id="resultSummary" class="topic-summary-box">H p~ を表示します。</div>
          </article>
        </section>

        <section class="vector-display-band">
          <div class="inverse-display-header">
            <h2>数式表示</h2>
            <span>最後に 1 を足して平行移動を行列に入れます</span>
          </div>
          <div id="equationDisplay" class="vector-equation"></div>
        </section>

        <section class="vector-diagram-band">
          <div class="vector-diagram-header">
            <div class="inverse-display-header">
              <h2>図解表示</h2>
              <span>元の点と変換後の点を比べます</span>
            </div>
            <div id="viewControls" class="control-group view-controls" hidden>
              <label>回転</label>
              <div class="view-slider-row"><span>X軸</span><input id="rotateX" type="range" min="-180" max="180" value="0" /><output id="rotateXValue">0°</output></div>
              <div class="view-slider-row"><span>Y軸</span><input id="rotateY" type="range" min="-180" max="180" value="0" /><output id="rotateYValue">0°</output></div>
              <div class="view-slider-row"><span>Z軸</span><input id="rotateZ" type="range" min="-180" max="180" value="0" /><output id="rotateZValue">0°</output></div>
            </div>
          </div>
          <svg id="vectorDiagram" class="vector-diagram" viewBox="0 0 720 360"></svg>
        </section>

        <section class="animation-band">
          <div class="timeline"><div id="animationTrack" class="animation-track"></div></div>
          <div class="formula-box">
            <div id="formulaTitle" class="formula-title">同次座標</div>
            <div id="formula" class="formula">2D では [x y 1]^T、3D では [x y z 1]^T にします。</div>
            <div class="history-title">計算履歴</div>
            <ol id="historyList" class="history-list"></ol>
          </div>
        </section>
      </section>
    </main>
    <script src="./future_topics.js"></script>
  </body>
</html>
